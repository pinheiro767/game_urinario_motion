<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07152c">
<meta name="color-scheme" content="dark">
<meta name="description" content="UrinaMotion: um jogo sensorial e científico para explorar a filtração, reabsorção, transporte da urina e micção.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="UrinaMotion">
<meta name="mobile-web-app-capable" content="yes">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="stylesheet" href="./styles.css">
<title>UrinaMotion 3D — Laboratório Sensorial</title>
</head>
<body>
<div class="background-sheen" aria-hidden="true"></div>
<header class="topbar">
  <button class="brand" type="button" data-nav="home" aria-label="Ir ao início">
    <span class="brand-symbol" aria-hidden="true">◈</span>
    <span class="brand-copy"><strong>URINA<span>MOTION</span></strong><small>LABORATÓRIO SENSORIAL 3D</small></span>
  </button>
  <div class="top-actions">
    <span class="online-badge"><span class="online-dot"></span> <span id="connection-label">Pronto para jogar</span></span>
    <button class="icon-button" id="sound-toggle" type="button" aria-label="Ativar ou desativar efeitos sonoros" title="Efeitos sonoros">♫</button>
    <button class="icon-button" id="voice-toggle" type="button" aria-label="Ouvir instruções" title="Ouvir explicação">◖))</button>
    <button class="install-button" id="install-button" type="button">↓ <span>Instalar</span></button>
  </div>
</header>
<main id="app" class="app-content" tabindex="-1" aria-live="polite"></main>
<nav class="mobile-nav" aria-label="Navegação principal">
  <button type="button" data-nav="home" id="nav-home"><span aria-hidden="true">⌂</span><small>Início</small></button>
  <button type="button" data-nav="stages" id="nav-stages"><span aria-hidden="true">◈</span><small>Missões</small></button>
  <button type="button" data-nav="journal" id="nav-journal"><span aria-hidden="true">▤</span><small>Diário</small></button>
</nav>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="dialog-backdrop" id="dialog-backdrop" hidden>
  <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title">
    <button class="dialog-close" id="dialog-close" type="button" aria-label="Fechar">×</button>
    <div class="dialog-orbit" aria-hidden="true">◈</div>
    <h2 id="dialog-title">Instale o UrinaMotion</h2>
    <div id="dialog-body"></div>
    <button class="primary-button" id="dialog-ok" type="button">Entendi</button>
  </section>
</div>
<script src="./app.js" defer></script>
</body>
</html>
